[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _      # user-role or role-role
g2 = _, _     # API-to-resource mapping
g3 = _, _     # resource-to-resource mapping (optional)

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && g2(r.obj, p.obj) && r.act == p.act